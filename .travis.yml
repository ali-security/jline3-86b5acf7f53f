language: java

sudo: false

env:
  global:
    - secure: ''
    - secure: ''
    - MAVEN_SETTINGS='.travis/settings.xml'
    - MAVEN_OPTIONS="-V -B -s $MAVEN_SETTINGS"

branches:
  only:
    - master

jdk:
  - openjdk8

# FIXME: for now just complain; do not fail as the present license headers have inconsistent date ranges
install: ./build ci-prepare -Dlicense.failIfMissing=false $MAVEN_OPTIONS

# seal: non-PR ci-build runs `mvn clean deploy` (needs Sonatype secrets); run `mvn clean install` instead
# seal: retry transient Maven Central transfer errors (a "Connection reset" downloading groovy-json failed one run)
script: ./build rebuild $MAVEN_OPTIONS -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true

# seal: print each skipped test and its reason so the log explains every skip
after_script:
  - echo "=== Skipped tests (surefire reports) ==="
  - if ! grep -rh -A1 '<skipped' --include='TEST-*.xml' . ; then echo "no skipped entries"; fi
  - echo "=== @Ignore / assume in test sources ==="
  - if ! grep -rn -B1 -A1 -E '@Ignore|assume(True|False|That)\(' --include='*Test.java' . ; then echo "none"; fi
