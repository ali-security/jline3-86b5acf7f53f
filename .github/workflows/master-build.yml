name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector (empty = full suite)'
        required: false
        default: ''

jobs:
  compile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java: [ '11' ]
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ matrix.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ matrix.os }}-maven-

      - name: Build with maven
        run: mvn --activate-profiles ci --no-transfer-progress package -DskipTests

  test:
    needs: compile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java: [ '1.8', '11', '17' ]
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ matrix.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ matrix.os }}-maven-

      - name: Build with maven
        shell: bash
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            mvn --activate-profiles ci --no-transfer-progress package "-Dtest=$TEST_FILTER" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn --activate-profiles ci --no-transfer-progress package
          fi

      - name: Report skipped tests
        if: always()
        shell: bash
        run: |
          echo "=== Skipped tests (surefire reports) ==="
          if ! grep -rh -A1 '<skipped' --include='TEST-*.xml' . ; then echo "no skipped entries"; fi

      - name: Upload jline-builtins jar
        if: matrix.os == 'ubuntu-latest' && matrix.java == '11'
        uses: actions/upload-artifact@v4
        with:
          name: jline-builtins-jar
          path: builtins/target/jline-builtins-3.21.0.jar
          if-no-files-found: error
